name: System Audit

on:
  schedule:
    # Friday 16:00 EST = 21:00 UTC
    - cron: "0 21 * * 5"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/engine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run system audit
        run: |
          python main.py audit
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FREE_LLM_PROXY_URL: ${{ secrets.FREE_LLM_PROXY_URL }}
          FREE_PROXY_MASTER_KEY: ${{ secrets.FREE_PROXY_MASTER_KEY }}

      - name: Cleanup old records
        run: |
          python main.py cleanup
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_LLM_PROXY_URL: ${{ secrets.FREE_LLM_PROXY_URL }}
          FREE_PROXY_MASTER_KEY: ${{ secrets.FREE_PROXY_MASTER_KEY }}

      - name: Run missed gainers post-mortem audit
        run: |
          python main.py gainers-postmortem --timeframe all --limit 3
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Audit recent trade prices
        run: |
          python scripts/audit_trade_prices.py --since-days 7
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}