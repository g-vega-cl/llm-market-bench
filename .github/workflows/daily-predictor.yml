name: Daily S&P Predictor and Autoresearch

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Task to execute'
        required: true
        default: 'daily-predictor'
        type: choice
        options:
          - 'daily-predictor'
          - 'evaluate-daily-predictions'
          - 'daily-autoresearch'

jobs:
  run-daily-predictor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd apps/engine
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt

      - name: Determine command to run & verify safety window
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMMAND="${{ inputs.action }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "13" ]; then
              COMMAND="daily-predictor"
            elif [ "$HOUR" = "21" ]; then
              COMMAND="evaluate-daily-predictions"
            elif [ "$HOUR" = "22" ]; then
              COMMAND="daily-autoresearch"
            else
              COMMAND="daily-predictor"
            fi
          fi

          echo "command=$COMMAND" >> $GITHUB_OUTPUT

          # Pre-market prediction safety check: skip if running after 13:30 UTC (9:30 AM EDT market open)
          if [ "$COMMAND" = "daily-predictor" ]; then
            NOW_MINUTES=$(( $(date -u +%H) * 60 + $(date -u +%M) ))
            # 13:30 UTC = 810 minutes; 20:00 UTC = 1200 minutes (intraday window)
            if [ "$NOW_MINUTES" -ge 810 ] && [ "$NOW_MINUTES" -lt 1200 ]; then
              echo "WARNING: Pre-market prediction triggered after 9:30 AM ET market open ($NOW_MINUTES mins UTC). Skipping to avoid stale prediction."
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Daily Predictor Command
        if: steps.cmd.outputs.skip != 'true'
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          cd apps/engine
          PYTHONPATH=. ./venv/bin/python3 main.py ${{ steps.cmd.outputs.command }}

