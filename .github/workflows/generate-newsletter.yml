name: Daily Newsletter Generator

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Session window for newsletter (open or close)'
        required: true
        default: 'open'
        type: choice
        options:
          - 'open'
          - 'close'

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd apps/engine
          python3 -m venv venv
          ./venv/bin/pip install -r requirements.txt

      - name: Determine session window
        id: sess
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SESSION="${{ inputs.session }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "13" ] || [ "$HOUR" = "14" ]; then
              SESSION="open"
            else
              SESSION="close"
            fi
          fi
          echo "session=$SESSION" >> $GITHUB_OUTPUT

      - name: Run Newsletter Generator
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

        run: |
          cd apps/engine
          PYTHONPATH=. ./venv/bin/python3 main.py generate-newsletter --session ${{ steps.sess.outputs.session }}

      - name: Trigger Downstream Daily Predictor
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          if [ "${{ steps.sess.outputs.session }}" = "open" ]; then
            ACTION="daily-predictor"
          else
            ACTION="evaluate-daily-predictions"
          fi

          echo "Triggering daily-predictor.yml with action=$ACTION..."
          if [ -n "$GITHUB_PAT" ]; then
            curl -s -f -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_PAT" \
              -H "User-Agent: GitHub-Actions-Chaining" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-predictor.yml/dispatches \
              -d "{\"ref\":\"main\",\"inputs\":{\"action\":\"$ACTION\"}}" && echo "Dispatched daily-predictor.yml successfully via GitHub API." || echo "Failed to dispatch via API."
          elif [ -n "$GH_TOKEN" ]; then
            gh workflow run daily-predictor.yml -f action="$ACTION" || echo "Failed to dispatch via gh CLI."
          else
            echo "No auth token available, skipping downstream daily-predictor dispatch."
          fi
