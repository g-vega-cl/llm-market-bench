name: Daily Ingestion & Consensus

on:
  schedule:
    # 09:35 ET = 14:35 UTC (EST) / 13:35 UTC (EDT)
    - cron: "35 14 * * 1-5"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/engine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run ingestion & consensus pipeline
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

          # Added for Newsletter Ingestion
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          IBKR_PROXY_URL: ${{ secrets.IBKR_PROXY_URL }}
          IBKR_PROXY_TOKEN: ${{ secrets.IBKR_PROXY_TOKEN }}

          # Optional Configuration (Maps to GitHub Repository Variables or Secrets)
          # Note: Ensure these are set as VARIABLES if using the 'vars' context below.
          # If set as SECRETS, use '${{ secrets.NAME }}' instead.
          FINANCIAL_PROVIDER: ${{ vars.FINANCIAL_PROVIDER || secrets.FINANCIAL_PROVIDER }}
          FALLBACK_FINANCIAL_PROVIDER: ${{ vars.FALLBACK_FINANCIAL_PROVIDER || secrets.FALLBACK_FINANCIAL_PROVIDER }}
          SECOND_FALLBACK_FINANCIAL_PROVIDER: ${{ vars.SECOND_FALLBACK_FINANCIAL_PROVIDER || secrets.SECOND_FALLBACK_FINANCIAL_PROVIDER }}
          MARKET_DATA_RETRIES: ${{ vars.MARKET_DATA_RETRIES || secrets.MARKET_DATA_RETRIES || 2}}
          FINANCIAL_API_THROTTLE_SECONDS: ${{ vars.FINANCIAL_API_THROTTLE_SECONDS || secrets.FINANCIAL_API_THROTTLE_SECONDS || 2 }}

          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          python main.py ingest
