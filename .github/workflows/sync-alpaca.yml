name: Sync Alpaca Orders

on:
  schedule:
    # Every 15 min across the US session (13:00-21:45 UTC covers 09:30-16:00 ET
    # in both EDT and EST) so a rejected order does not read SUBMITTED until after the close.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

# A manual dispatch must not overlap the scheduled run: the repair pass is a
# compare-and-set, but two concurrent full syncs would still double-poll Alpaca.
concurrency:
  group: sync-alpaca
  cancel-in-progress: false

jobs:
  sync-alpaca:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: apps/engine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Sync Alpaca order status
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python scripts/sync_alpaca_orders.py
