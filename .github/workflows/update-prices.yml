name: Price Update

on:
  schedule:
    # Every 30 minutes during market hours (approx 13:00 - 21:00 UTC)
    # Covers EDT 9:30 AM open (13:30 UTC) and EST 9:30 AM open (14:30 UTC).
    # Pre-market runs are safely skipped by is_market_open() failsafe.
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch:


jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/engine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run price update script
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          
          # Market Data Retrieval & Fallbacks
          FINANCIAL_PROVIDER: ${{ vars.FINANCIAL_PROVIDER || secrets.FINANCIAL_PROVIDER }}
          FALLBACK_FINANCIAL_PROVIDER: ${{ vars.FALLBACK_FINANCIAL_PROVIDER || secrets.FALLBACK_FINANCIAL_PROVIDER }}
          SECOND_FALLBACK_FINANCIAL_PROVIDER: ${{ vars.SECOND_FALLBACK_FINANCIAL_PROVIDER || secrets.SECOND_FALLBACK_FINANCIAL_PROVIDER }}
          MARKET_DATA_RETRIES: ${{ vars.MARKET_DATA_RETRIES || secrets.MARKET_DATA_RETRIES || 2 }}
        run: |
          python scripts/update_prices.py
