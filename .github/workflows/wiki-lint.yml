name: Wiki Lint

on:
  schedule:
    # Saturday 15:00 UTC = 10:00 AM ET (off-market)
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model for LLM lint"
        required: false
        type: string
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml requests python-dotenv

      - name: Run structural lint
        run: |
          echo "--- Structural Wiki Lint ---"
          PYTHONPATH=. python apps/engine/wiki_lint.py
        continue-on-error: false

      - name: Run LLM lint
        id: llm_lint
        run: |
          MODEL="${{ inputs.model || 'deepseek/deepseek-v4-pro' }}"
          echo "Using model: $MODEL"
          PYTHONPATH=. python apps/engine/wiki_lint_llm.py --model "$MODEL" > /tmp/findings.json
          # Use a more robust way to count findings, handling potential extra data or empty files
          FINDINGS_COUNT=$(python -c "
          import json
          try:
              with open('/tmp/findings.json') as f:
                  data = json.load(f)
                  print(len(data.get('findings', [])))
          except Exception:
              print(0)
          ")
          echo "findings_count=$FINDINGS_COUNT" >> $GITHUB_OUTPUT
          cat /tmp/findings.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Create issue from findings
        if: steps.llm_lint.outputs.findings_count != '0'
        run: |
          python -c "
          import json
          try:
              data = json.load(open('/tmp/findings.json'))
              findings = data.get('findings', [])
              summary = data.get('summary', '')

              body = f'## Wiki Lint Report\n\n**Summary**: {summary}\n\n'
              for i, f in enumerate(findings):
                  sev = f.get('severity', 'low').upper()
                  emoji = {'HIGH': '🔴', 'MEDIUM': '🟡', 'LOW': '🟢'}.get(sev, '⚪')
                  pages = ', '.join(f.get('pages', []))
                  body += f\"\"\"### {i+1}. {emoji} [{sev}] {f.get('type', 'unknown')}

          **Pages**: {pages}

          {f.get('description', '')}

          **Suggestion**: {f.get('suggestion', 'No suggestion')}

          ---

          \"\"\"
              with open('/tmp/issue-body.md', 'w') as fh:
                  fh.write(body)
          except Exception as e:
              print(f'Error generating issue body: {e}')
              exit(1)
          "
          
          # Ensure label exists (check first to avoid unnecessary errors)
          if ! gh label list --json name -q '.[].name' | grep -qx "wiki-lint"; then
            gh label create "wiki-lint" --color "f29513" --description "Wiki quality findings"
          fi

          gh issue create \
            --title "Wiki Lint — $(date +%Y-%m-%d)" \
            --body-file /tmp/issue-body.md \
            --label "wiki-lint"
        env:
          GH_TOKEN: ${{ github.token }}
