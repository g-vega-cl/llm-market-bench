[build]
  command = "pnpm build:web"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "24"

[dev]
  command = "pnpm dev"
  port = 3000

[[redirects]]
  from = "/p/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/p/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/p/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    fail_deploy_on_score_thresholds = true

  [plugins.inputs.thresholds]
    performance = 0.90
    accessibility = 0.90
    best-practices = 0.90
    seo = 0.90

  [[plugins.inputs.audits]]
    path = "/"

  [[plugins.inputs.audits]]
    path = "/how-it-works"

  [[plugins.inputs.audits]]
    path = "/portfolios"
