[build]
  command = "pnpm build:web"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "24"

[dev]
  command = "pnpm dev"
  port = 3000

[[redirects]]
  from = "/p/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/p/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/p/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/p/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Public homepage + marketing pages: 60s CDN cache, 5min stale-while-revalidate.
# Anonymous traffic to the root is the dominant case from Lighthouse.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=300"

# Vite's content-hashed asset filenames are immutable for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Personalized content under /_authed/* is never cached.
[[headers]]
  for = "/_authed/*"
  [headers.values]
    Cache-Control = "private, no-store"


