[build]
  command = "pnpm build:web"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "24"
  SECRETS_SCAN_OMIT_KEYS = "ARCHIVE_DB_URL,VITE_ARCHIVE_DB_URL,SUPABASE_AUTH_URL,VITE_SUPABASE_AUTH_URL,SUPABASE_URL,VITE_SUPABASE_URL,ARCHIVE_DB_ANON_KEY,VITE_ARCHIVE_DB_ANON_KEY,SUPABASE_AUTH_ANON_KEY,VITE_SUPABASE_AUTH_ANON_KEY,VITE_PUBLIC_POSTHOG_HOST,VITE_PUBLIC_POSTHOG_PROJECT_TOKEN"
  SECRETS_SCAN_OMIT_PATHS = "wiki/**,docker/**,apps/engine/tests/**,apps/web/src/lib/*.test.ts"

[dev]
  command = "pnpm dev"
  port = 3000

[[redirects]]
  from = "/p/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/p/array/*"
  to = "https://us-assets.i.posthog.com/array/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/p/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/p/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"


