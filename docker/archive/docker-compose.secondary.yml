services:
  archive-db-replica:
    image: ankane/pgvector:latest
    container_name: market-bench-archive-db-replica
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_bench_archive}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRIMARY_HOST: ${PRIMARY_HOST:-primary-workstation}
      PRIMARY_PORT: ${PRIMARY_PORT:-5433}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      REPLICATION_SLOT: ${REPLICATION_SLOT:-minipc_standby_slot}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - archive_pgdata_replica:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_bench_archive"]
      interval: 5s
      timeout: 5s
      retries: 5

  archive-postgrest:
    image: postgrest/postgrest:latest
    container_name: market-bench-archive-postgrest-replica
    restart: unless-stopped
    depends_on:
      archive-db-replica:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@archive-db-replica:5432/${POSTGRES_DB:-market_bench_archive}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_CHANNEL_ENABLED: "false"
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PGRST_OPENAPI_SERVER_PROXY_URI:-https://benchify-archive-db.clvg.uk}
    expose:
      - "3000"

  archive-proxy:
    image: nginx:alpine
    container_name: market-bench-archive-proxy-replica
    restart: unless-stopped
    depends_on:
      - archive-postgrest
    extra_hosts:
      - "primary-workstation:${PRIMARY_WORKSTATION_IP:-127.0.0.1}"
    ports:
      - "3001:80"
    volumes:
      - ./nginx.secondary.conf:/etc/nginx/nginx.conf:ro

  free-llm-proxy:
    build:
      context: ../../apps/free_llm_proxy
      dockerfile: Dockerfile
    container_name: free-llm-proxy-secondary
    restart: unless-stopped
    extra_hosts:
      - "primary-workstation:${PRIMARY_WORKSTATION_IP:-127.0.0.1}"
    ports:
      - "8086:8086"
    env_file:
      # Optional: the proxy also runs with only `environment:` below, and this
      # file is absent on both the workstation and the mini PC. Declaring it
      # required made `docker compose up` abort the whole secondary deploy.
      - path: ../../apps/free_llm_proxy/.env
        required: false
    environment:
      STRATA_BASE_URL: ${STRATA_BASE_URL:-http://primary-workstation:3001/strata/v1}
      CONNECTOR_ID: secondary
    volumes:
      - free_llm_proxy_data:/app/apps/free_llm_proxy/data
    deploy:
      resources:
        limits:
          memory: 128M

  live-spy-trader:
    build:
      context: ../..
      dockerfile: docker/archive/Dockerfile.trader
    container_name: market-bench-live-spy-trader
    restart: unless-stopped
    extra_hosts:
      - "primary-workstation:${PRIMARY_WORKSTATION_IP:-127.0.0.1}"
    ports:
      - "8090:8090"
    env_file:
      - ../../apps/engine/.env
    environment:
      STRATA_BASE_URL: ${STRATA_BASE_URL:-http://primary-workstation:3001/strata/v1}
      FREE_LLM_PROXY_URL: https://llm.clvg.uk/v1
      FREE_PROXY_MODEL: ${FREE_PROXY_MODEL:-auto-go}
    # Shared SQLite call log: the engine writes the same call_logs table the proxy owns,
    # so direct OpenRouter generations land in one local store instead of PostHog.
    volumes:
      - free_llm_proxy_data:/app/apps/free_llm_proxy/data
    deploy:
      resources:
        limits:
          memory: 1G

  recipe-worker:
    build:
      context: ../..
      dockerfile: docker/archive/Dockerfile.trader
    container_name: market-bench-recipe-worker
    restart: unless-stopped
    command: ["python3", "-m", "recipes.runner", "--loop"]
    extra_hosts:
      - "primary-workstation:${PRIMARY_WORKSTATION_IP:-127.0.0.1}"
    env_file:
      - ../../apps/engine/.env
    environment:
      STRATA_BASE_URL: ${STRATA_BASE_URL:-http://primary-workstation:3001/strata/v1}
      FREE_LLM_PROXY_URL: https://llm.clvg.uk/v1
      ARCHIVE_DB_URL: http://archive-proxy:80
    volumes:
      - free_llm_proxy_data:/app/apps/free_llm_proxy/data
    deploy:
      resources:
        limits:
          memory: 512M

  web-app:
    build:
      context: ../..
      dockerfile: docker/archive/Dockerfile.web
      args:
        VITE_ARCHIVE_DB_URL: ${VITE_ARCHIVE_DB_URL:-https://benchify-archive-db.clvg.uk}
        VITE_ARCHIVE_DB_ANON_KEY: ${VITE_ARCHIVE_DB_ANON_KEY:-}
        VITE_SUPABASE_AUTH_URL: ${VITE_SUPABASE_AUTH_URL:-}
        VITE_SUPABASE_AUTH_ANON_KEY: ${VITE_SUPABASE_AUTH_ANON_KEY:-}
        VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${VITE_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: market-bench-web-app-secondary
    restart: unless-stopped
    depends_on:
      - archive-proxy
    env_file:
      - ${WEB_ENV_FILE:-../../apps/web/.env}
    environment:
      ARCHIVE_DB_URL: http://archive-proxy:80
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M

  web-proxy:
    image: nginx:alpine
    container_name: market-bench-web-proxy-secondary
    restart: unless-stopped
    depends_on:
      - web-app
      - archive-proxy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:3005:80"
    # The proxy targets the primary first so both tunnel connectors answer with
    # the same build; the local web-app is only a fallback.
    extra_hosts:
      - "primary-workstation:${PRIMARY_WORKSTATION_IP:-127.0.0.1}"
    volumes:
      - ./nginx.web.secondary.conf:/etc/nginx/nginx.conf:ro

volumes:
  archive_pgdata_replica:
    name: archive_pgdata_replica
  free_llm_proxy_data:
    name: free_llm_proxy_data
