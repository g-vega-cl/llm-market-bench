services:
  archive-db:
    image: ankane/pgvector:latest
    container_name: market-bench-archive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_bench_archive}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:5433:5432"
    volumes:
      - archive_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_bench_archive"]
      interval: 5s
      timeout: 5s
      retries: 5

  archive-postgrest:
    image: postgrest/postgrest:latest
    container_name: market-bench-archive-postgrest
    restart: unless-stopped
    depends_on:
      archive-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@archive-db:5432/${POSTGRES_DB:-market_bench_archive}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PGRST_OPENAPI_SERVER_PROXY_URI:-https://benchify-archive-db.clvg.uk}
    expose:
      - "3000"

  archive-proxy:
    image: nginx:alpine
    container_name: market-bench-archive-proxy
    restart: unless-stopped
    depends_on:
      - archive-postgrest
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  archive_pgdata:
