services:
  archive-db:
    image: ankane/pgvector:latest
    container_name: market-bench-archive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_bench_archive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: archive_secure_password_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - archive_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_bench_archive"]
      interval: 5s
      timeout: 5s
      retries: 5

  archive-postgrest:
    image: postgrest/postgrest:latest
    container_name: market-bench-archive-postgrest
    restart: unless-stopped
    depends_on:
      archive-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:archive_secure_password_local@archive-db:5432/market_bench_archive
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_OPENAPI_SERVER_PROXY_URI: https://benchify-archive-db.clvg.uk
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  archive_pgdata:
