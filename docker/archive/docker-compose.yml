services:
  archive-db:
    image: ankane/pgvector:latest
    container_name: market-bench-archive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_bench_archive}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:5433:5432"
    volumes:
      - archive_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_bench_archive"]
      interval: 5s
      timeout: 5s
      retries: 5

  archive-postgrest:
    image: postgrest/postgrest:latest
    container_name: market-bench-archive-postgrest
    restart: unless-stopped
    depends_on:
      archive-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@archive-db:5432/${POSTGRES_DB:-market_bench_archive}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${PGRST_OPENAPI_SERVER_PROXY_URI:-https://benchify-archive-db.clvg.uk}
    expose:
      - "3000"

  archive-proxy:
    image: nginx:alpine
    container_name: market-bench-archive-proxy
    restart: unless-stopped
    depends_on:
      - archive-postgrest
    extra_hosts:
      - "minipc:${MINIPC_IP:-100.119.63.53}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  web-app:
    build:
      context: ../..
      dockerfile: docker/archive/Dockerfile.web
      args:
        VITE_ARCHIVE_DB_URL: ${VITE_ARCHIVE_DB_URL:-https://benchify-archive-db.clvg.uk}
        VITE_ARCHIVE_DB_ANON_KEY: ${VITE_ARCHIVE_DB_ANON_KEY:-}
        VITE_SUPABASE_AUTH_URL: ${VITE_SUPABASE_AUTH_URL:-}
        VITE_SUPABASE_AUTH_ANON_KEY: ${VITE_SUPABASE_AUTH_ANON_KEY:-}
        VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${VITE_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: market-bench-web-app
    restart: unless-stopped
    depends_on:
      - archive-proxy
    env_file:
      - ../../apps/web/.env
    environment:
      ARCHIVE_DB_URL: http://archive-proxy:80
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M

  web-proxy:
    image: nginx:alpine
    container_name: market-bench-web-proxy
    restart: unless-stopped
    depends_on:
      - web-app
      - archive-proxy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:3005:80"
    volumes:
      - ./nginx.web.conf:/etc/nginx/nginx.conf:ro

volumes:
  archive_pgdata:
