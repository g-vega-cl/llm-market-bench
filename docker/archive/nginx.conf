events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost benchify-archive-db.clvg.uk;
        client_max_body_size 50M;

        # Healthcheck endpoint
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Intraday Tape SSE and Health Stream
        location /api/tape/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $tape_backend http://live-spy-trader:8090;
            proxy_pass $tape_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # Strata Local Engine route for cross-node Tailscale proxying
        location /strata/ {
            proxy_pass http://172.17.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_request_headers on;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # Supabase REST API route: /rest/v1/* -> /* on PostgREST
        location /rest/v1/ {
            proxy_pass http://archive-postgrest:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_request_headers on;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Root route for PostgREST
        location / {
            proxy_pass http://archive-postgrest:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_request_headers on;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
