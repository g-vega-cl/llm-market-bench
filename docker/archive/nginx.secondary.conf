events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream local_read_backend {
        server archive-postgrest:3000;
    }

    upstream primary_write_backend {
        server primary-workstation:3001;
    }

    # Route read operations to local replica PostgREST; forward mutations to primary
    map $request_method $upstream_backend {
        GET     local_read_backend;
        HEAD    local_read_backend;
        OPTIONS local_read_backend;
        POST    primary_write_backend;
        PUT     primary_write_backend;
        PATCH   primary_write_backend;
        DELETE  primary_write_backend;
        default primary_write_backend;
    }

    server {
        listen 80;
        server_name localhost benchify-archive-db.clvg.uk;
        client_max_body_size 50M;

        # Healthcheck endpoint
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Intraday Tape SSE and Health Stream
        location /api/tape/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $tape_backend http://live-spy-trader:8090;
            proxy_pass $tape_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # Structured JSON 503 response if primary write node is offline
        error_page 502 503 504 = @primary_down;
        location @primary_down {
            default_type application/json;
            return 503 '{"error": "Primary write node unavailable; read-replica is active", "status": 503}\n';
        }

        # Supabase REST API route: /rest/v1/* -> /*
        location /rest/v1/ {
            rewrite ^/rest/v1/(.*)$ /$1 break;
            proxy_pass http://$upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_request_headers on;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 300s;
            proxy_intercept_errors on;
        }

        # Root route for PostgREST
        location / {
            proxy_pass http://$upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_request_headers on;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 300s;
            proxy_intercept_errors on;
        }
    }
}
