events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Supabase SSR auth cookies and TanStack Start headers can exceed Nginx's default 4k/8k header buffer.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 32k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Preserve HTTPS scheme forwarded by Cloudflare Tunnel while still working on plain HTTP localhost.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name localhost benchify.dev www.benchify.dev;
        client_max_body_size 10M;

        # Healthcheck endpoint for Docker and tunnel monitoring
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Intraday Tape SSE stream routed directly to the local archive-proxy on the Docker network
        location /api/tape/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $archive_backend http://archive-proxy:80;
            proxy_pass $archive_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # PostHog stealth proxy routes (matches apps/web/netlify.toml)
        location /p/static/ {
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            set $posthog_assets https://us-assets.i.posthog.com;
            rewrite ^/p/static/(.*)$ /static/$1 break;
            proxy_pass $posthog_assets;
            proxy_ssl_server_name on;
            proxy_set_header Host us-assets.i.posthog.com;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /p/array/ {
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            set $posthog_assets https://us-assets.i.posthog.com;
            rewrite ^/p/array/(.*)$ /array/$1 break;
            proxy_pass $posthog_assets;
            proxy_ssl_server_name on;
            proxy_set_header Host us-assets.i.posthog.com;
        }

        location /p/ {
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            set $posthog_ingest https://us.i.posthog.com;
            rewrite ^/p/(.*)$ /$1 break;
            proxy_pass $posthog_ingest;
            proxy_ssl_server_name on;
            proxy_set_header Host us.i.posthog.com;
        }

        # Immutable caching for content-hashed Vite client chunks
        location /assets/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $web_backend http://web-app:3000;
            proxy_pass $web_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # TanStack Start SSR, server functions, and static public files
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $web_backend http://web-app:3000;
            proxy_pass $web_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
}
