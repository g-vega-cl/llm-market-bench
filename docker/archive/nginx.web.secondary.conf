events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Supabase SSR auth cookies and TanStack Start headers can exceed Nginx's default 4k/8k header buffer.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 32k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Resolved at startup from /etc/hosts (extra_hosts). Do NOT switch these to
    # a $variable proxy_pass: nginx then asks Docker's embedded resolver, which
    # answers SERVFAIL for hosts-file names and silently forces the fallback.
    upstream primary_web {
        server primary-workstation:3005;
        keepalive 16;
    }

    upstream local_web {
        server web-app:3000;
        keepalive 16;
    }

    # Preserve HTTPS scheme forwarded by Cloudflare Tunnel while still working on plain HTTP localhost.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name localhost benchify.dev www.benchify.dev;
        client_max_body_size 10M;

        # The tunnel registers one connector per host, and Cloudflare round-robins
        # requests between them. Two independently built bundles mean the HTML from
        # one origin names chunk hashes the other does not have, every module 404s,
        # and React never hydrates — a page that renders and cannot be clicked.
        #
        # So this origin serves the primary's bytes whenever the primary is up: the
        # answer is then identical whichever connector Cloudflare picks. The local
        # build is a degraded fallback, reached only when the primary times out or
        # refuses, and it is internally consistent on its own.
        #
        # Keep this file in sync with the rsync list in deploy_secondary.sh.

        # Healthcheck endpoint stays local so tunnel monitoring does not flap with the primary.
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Intraday Tape SSE stream stays on the local read replica: it is read-only,
        # and keeping it local means a primary outage still leaves a live tape.
        location /api/tape/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $archive_backend http://archive-proxy:80;
            proxy_pass $archive_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # PostHog stealth proxy routes (matches apps/web/netlify.toml). Third-party
        # egress, so there is nothing origin-specific to keep in sync here.
        location /p/static/ {
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            set $posthog_assets https://us-assets.i.posthog.com;
            rewrite ^/p/static/(.*)$ /static/$1 break;
            proxy_pass $posthog_assets;
            proxy_ssl_server_name on;
            proxy_set_header Host us-assets.i.posthog.com;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        location /p/array/ {
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            set $posthog_assets https://us-assets.i.posthog.com;
            rewrite ^/p/array/(.*)$ /array/$1 break;
            proxy_pass $posthog_assets;
            proxy_ssl_server_name on;
            proxy_set_header Host us-assets.i.posthog.com;
        }

        location /p/ {
            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
            set $posthog_ingest https://us.i.posthog.com;
            rewrite ^/p/(.*)$ /$1 break;
            proxy_pass $posthog_ingest;
            proxy_ssl_server_name on;
            proxy_set_header Host us.i.posthog.com;
        }

        # Immutable caching for content-hashed Vite client chunks.
        location /assets/ {
            proxy_pass http://primary_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_intercept_errors on;
            error_page 404 502 503 504 = @assets_local;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        location @assets_local {
            proxy_pass http://local_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_hide_header Cache-Control;
            error_page 404 = @assets_missing;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        # Both origins missing the same hash: answer 404 but forbid caching, so
        # the edge does not pin a bad answer for a year.
        location @assets_missing {
            add_header Cache-Control "no-store" always;
            return 404;
        }

        # TanStack Start SSR, server functions, and static public files.
        location / {
            proxy_pass http://primary_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 3s;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @local_web_root;
        }

        location @local_web_root {
            proxy_pass http://local_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }
}
